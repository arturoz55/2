function rng(seed){return()=>{seed|=0;seed=(seed+0x6D2B79F5)|0;let t=Math.imul(seed^(seed>>>15),1|seed);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
function layer(){const cv=document.createElement("canvas");cv.width=W;cv.height=H;return [cv,cv.getContext("2d")];}
function soft(g,cx,cy,r,col,a){const gr=g.createRadialGradient(cx,cy,0,cx,cy,r);gr.addColorStop(0,`rgba(${col},${a})`);gr.addColorStop(1,`rgba(${col},0)`);g.fillStyle=gr;g.beginPath();g.arc(cx,cy,r,0,Math.PI*2);g.fill();}
function blob(g,cx,cy,rx,ry,rot,f){g.fillStyle=f;g.beginPath();g.ellipse(cx,cy,rx,ry,rot,0,Math.PI*2);g.fill();}
function tree(g,r,bx,top,bot,w,lean){const h=bot-top;g.strokeStyle="#0A1C22";g.lineWidth=Math.max(3,w*.05);g.lineCap="round";g.beginPath();g.moveTo(bx,bot);g.quadraticCurveTo(bx+lean*.3,top+h*.5,bx+lean,top+h*.08);g.stroke();
  const cl=[],rows=Math.max(6,Math.round(h/34));for(let i=0;i<rows;i++){const t=i/(rows-1),cy=top+t*h*.92,sp=w*(.18+.5*Math.sin(Math.min(1,t*1.25)*Math.PI*.62)),n=3+Math.round(sp/11);
  for(let k=0;k<n;k++){const cx=bx+lean*(1-t)+(r()-.5)*2*sp,rr=(10+r()*20)*(.55+t*.7)*(w/170);cl.push({cx,cy:cy+(r()-.5)*18,rx:rr*(1.05+r()*.5),ry:rr*(.62+r()*.3),rot:(r()-.5)*.9});}}
  cl.forEach(q=>blob(g,q.cx,q.cy,q.rx,q.ry,q.rot,"#0C2429"));cl.forEach(q=>blob(g,q.cx-q.rx*.18,q.cy-q.ry*.22,q.rx*.78,q.ry*.62,q.rot,"#15393A"));
  cl.forEach(q=>{if(r()<.75)blob(g,q.cx-q.rx*.32,q.cy-q.ry*.42,q.rx*.5,q.ry*.34,q.rot,"rgba(58,110,96,.72)");});cl.forEach(q=>{if(r()<.45)blob(g,q.cx-q.rx*.42,q.cy-q.ry*.52,q.rx*.26,q.ry*.16,q.rot,"rgba(150,196,168,.32)");});}
// ---- static layers ----
const r=rng(424242);
const [bg,bx]=layer();{const g=bx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#07142E");g.addColorStop(.3,"#10306A");g.addColorStop(.6,"#2A5BA0");g.addColorStop(.85,"#5F8DC6");g.addColorStop(1,"#8FB2DC");bx.fillStyle=g;bx.fillRect(0,0,W,H);

  for(let i=0;i<1600;i++){const t=r(),p=band(t),o=(r()+r()+r()-1.5)*W*.07;bx.fillStyle=`rgba(235,240,255,${(.08+r()*.35).toFixed(2)})`;bx.fillRect(p.x+o*.8,p.y+o*.6,1,1);}

const clouds=[];function plume(w0,h0,seed,curve){const P=110,w=w0+P*2,h=h0+P*2,rr=rng(seed),cv=document.createElement("canvas");cv.width=w;cv.height=h;const g=cv.getContext("2d");g.translate(P,P);for(let i=0;i<180;i++){const t=rr(),px=t*w0,py=h0*.5+Math.sin(t*Math.PI*curve)*h0*.28+(rr()-.5)*h0*.22;soft(g,px,py,(18+rr()*46)*(.5+Math.sin(t*Math.PI)*.8),"255,255,255",.05+rr()*.06);}return cv;}

{const hz=tx.createLinearGradient(0,H*.7,0,H);hz.addColorStop(0,"rgba(143,178,220,0)");hz.addColorStop(1,"rgba(143,178,220,.25)");tx.fillStyle=hz;tx.fillRect(0,H*.7,W,H*.3);}

// ---- helpers ----
const cl=v=>v<0?0:v>1?1:v, E=v=>1-Math.pow(1-cl(v),3), EI=v=>{v=cl(v);return v<.5?4*v*v*v:1-Math.pow(-2*v+2,3)/2;};
const win=(t,a,b,fi=.45,fo=.45)=>Math.min(E((t-a)/fi),1-E((t-(b-fo))/fo));
function text(s,px,py,font,col,a,align="center",ls=0){x.save();x.globalAlpha=a;x.font=font;x.fillStyle=col;x.textAlign=align;x.textBaseline="alphabetic";if(ls)x.letterSpacing=ls+"px";x.shadowColor="rgba(3,10,30,.55)";x.shadowBlur=24;x.fillText(s,px,py);x.restore();}
function mark(cx,cy,w,a,col="#fff"){const s=w/MW;x.save();x.globalAlpha=a;x.translate(cx-w/2,cy-MH*s/2);x.scale(s,s);x.fillStyle=col;x.shadowColor="rgba(159,239,228,.6)";x.shadowBlur=40/s;x.fill(MARK);x.restore();}
function pill(s,cx,cy,a,col,border){x.save();x.globalAlpha=a;x.font='500 22px "IBM Plex Mono"';const w=x.measureText(s).width+40,h=46;x.beginPath();x.roundRect(cx-w/2,cy-h/2,w,h,23);x.fillStyle="rgba(10,24,52,.72)";x.fill();x.lineWidth=2;x.strokeStyle=border;x.stroke();x.fillStyle=col;x.textAlign="center";x.textBaseline="middle";x.fillText(s,cx,cy+1);x.restore();}
const VEN=[["Arc v3",.6,"#43D3C3"],["Loom RFQ",.2,"#E7708A"],["Kiln AMM",.15,"#F4B740"],["Ferry v2",.05,"#6FA8E8"]];

window.renderAt=function(t){

  x.drawImage(bg,0,0);
  for(const q of clouds){const span=W+q.img.width,dx=((q.x+t*q.sp)%span+span)%span-q.img.width*.3;x.save();x.translate(dx+q.img.width/2,q.y+q.img.height/2);x.rotate(q.rot);x.drawImage(q.img,-q.img.width/2,-q.img.height/2);x.restore();}
  for(const s of tw){const a=.35+.65*(.5+.5*Math.sin(t*s.sp+s.ph));x.fillStyle=`rgba(255,255,255,${a.toFixed(3)})`;x.beginPath();x.arc(s.x,s.y,s.s,0,7);x.fill();}
  for(const [t0,mx,my] of [[2.2,W*.7,H*.08],[8.6,W*.95,H*.12],[13.6,W*.6,H*.05]]){const k=(t-t0)/.9;if(k>0&&k<1){const len=180,hx=mx-k*len*1.6,hy=my+k*len*.7,a=Math.sin(k*Math.PI);const g=x.createLinearGradient(hx,hy,hx+len*.9,hy-len*.4);g.addColorStop(0,`rgba(255,255,255,${(.9*a).toFixed(3)})`);g.addColorStop(1,"rgba(255,255,255,0)");x.strokeStyle=g;x.lineWidth=2;x.lineCap="round";x.beginPath();x.moveTo(hx,hy);x.lineTo(hx+len*.9,hy-len*.4);x.stroke();}}
  x.drawImage(tr,0,0);
  for(const f of flies){const fx=f.x+Math.sin(t*f.sp+f.ph)*f.amp,fy=f.y+Math.cos(t*f.sp*.8+f.ph)*f.amp*.6,a=.25+.75*Math.max(0,Math.sin(t*f.sp*2.2+f.ph));soft(x,fx,fy,8,"236,255,170",(.9*a).toFixed(3));}
  x.restore();
  // scrim for legibility
  const sg=x.createRadialGradient(W/2,H*.48,50,W/2,H*.48,W*.62);sg.addColorStop(0,"rgba(4,10,28,.55)");sg.addColorStop(1,"rgba(4,10,28,.1)");x.fillStyle=sg;x.fillRect(0,0,W,H);
  // grid overlay
  x.save();x.globalAlpha=.06;x.strokeStyle="#fff";x.lineWidth=1;for(let gx=40;gx<W;gx+=80){x.beginPath();x.moveTo(gx+.5,0);x.lineTo(gx+.5,H*.8);x.stroke();}for(let gy=0;gy<H*.8;gy+=80){x.beginPath();x.moveTo(0,gy+.5);x.lineTo(W,gy+.5);x.stroke();}x.restore();

  // 1 — logo reveal
  let a=win(t,.2,3.6,.9,.5);
  if(a>0){const s=.75+.25*E((t-.2)/1.2);soft(x,W/2,290,220,"67,211,195",.18*a);mark(W/2,290,260*s,a);
    text("Nodal",W/2,480,'800 104px "Bricolage Grotesque"',"#F6F8FF",win(t,.9,3.6,.6,.5),"center",-2);

  // 2 — the split

    const L=190,R=1090,y0=320,h=54,k=EI((t-4.6)/1.1),gap=14*k;let cx=L;const tot=R-L-gap*3;
    VEN.forEach(([n,sh,col],i)=>{const w=tot*sh,yy=y0+k*(i*0);x.save();x.globalAlpha=a*E((t-3.9)/.5);x.fillStyle=k>0?col:"#43D3C3";
      x.beginPath();x.roundRect(cx,yy,w,h,10);x.fill();x.restore();
      if(k>.6){const la=a*E((t-5.4-i*.12)/.4);text(`${n}`,cx+w/2,yy+h+42,'600 24px "IBM Plex Sans"',"#F6F8FF",i<3?la:0);text(`${Math.round(sh*100)}%`,cx+w/2,yy+h/2+9,'500 24px "IBM Plex Mono"',"#0B1633",i<3?la:0);}
      cx+=w+gap;});
    text("25 ETH order",W/2,y0+h/2+10,'600 26px "IBM Plex Sans"',"#0B2F2B",a*E((t-3.9)/.5)*(1-E((t-4.5)/.3)));
    text("Each slice goes to the venue that prices it best.",W/2,560,'500 28px "IBM Plex Sans"',"rgba(228,236,255,.9)",win(t,5.8,7.2,.5,.5));}
  // 3 — the promise
  a=win(t,7.1,10.4,.4,.5);
  if(a>0){[["Five venues.",7.2,"#F6F8FF"],["One quote.",7.75,"#F6F8FF"],["One transaction.",8.3,"#9FEFE4"]].forEach(([s,t0,col],i)=>{const k=E((t-t0)/.55);
      x.save();x.translate(-40*(1-k),0);text(s,170,260+i*105,'800 88px "Bricolage Grotesque"',col,a*k,"left",-2);x.restore();});}
  // 4 — zcash tips
  a=win(t,10.3,13.5,.5,.5);
  if(a>0){const p=E((t-10.4)/1.1);x.save();x.globalAlpha=a;x.translate(330,360);x.scale(1.9,1.9);
      const sh=new Path2D("M0 -64 L52 -42 L52 -6 C52 34 30 58 0 68 C-30 58 -52 34 -52 -6 L-52 -42 Z");
      x.fillStyle="rgba(67,211,195,.14)";x.fill(sh);x.setLineDash([420]);x.lineDashOffset=420*(1-p);x.strokeStyle="#43D3C3";x.lineWidth=5;x.lineJoin="round";x.stroke(sh);

    x.save();x.translate(0,0);pill("Shielded · unified address",562+170,420,a*E((t-11.5)/.5),"#7EF0A8","rgba(126,240,168,.6)");x.restore();

  const fb=Math.max(1-E(t/.6),0);if(fb>0){x.fillStyle=`rgba(0,0,0,${fb})`;x.fillRect(0,0,W,H);}
};
