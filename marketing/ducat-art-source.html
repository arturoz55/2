function rng(seed){return()=>{seed|=0;seed=(seed+0x6D2B79F5)|0;let t=Math.imul(seed^(seed>>>15),1|seed);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
function soft(g,cx,cy,r,col,a){const gr=g.createRadialGradient(cx,cy,0,cx,cy,r);gr.addColorStop(0,`rgba(${col},${a})`);gr.addColorStop(1,`rgba(${col},0)`);g.fillStyle=gr;g.beginPath();g.arc(cx,cy,r,0,Math.PI*2);g.fill();}

function sun(g,x,y,R,t){soft(g,x,y,R*9,"255,240,200",.35);soft(g,x,y,R*4,"255,248,220",.55);
  g.save();g.translate(x,y);g.rotate(t*.05);g.fillStyle="rgba(255,226,140,.45)";for(let i=0;i<12;i++){g.rotate(Math.PI/6);g.beginPath();g.moveTo(R*1.25,-R*.12);g.lineTo(R*(1.9+.12*Math.sin(t*1.5+i)),0);g.lineTo(R*1.25,R*.12);g.closePath();g.fill();}g.restore();
  const sg=g.createRadialGradient(x-R*.3,y-R*.3,R*.1,x,y,R);sg.addColorStop(0,"#FFFBE8");sg.addColorStop(.6,"#FFE08A");sg.addColorStop(1,"#FFC857");g.fillStyle=sg;g.beginPath();g.arc(x,y,R,0,7);g.fill();}
function beams(g,x,y,H,r){g.save();g.translate(x,y);for(let i=0;i<7;i++){const a=Math.PI*(.55+i*.09+(r()-.5)*.04),len=H*(1.2+r()*.4),w=.035+r()*.03;const gr=g.createLinearGradient(0,0,Math.cos(a)*len,Math.sin(a)*len);gr.addColorStop(0,"rgba(255,250,225,.24)");gr.addColorStop(1,"rgba(255,250,225,0)");g.fillStyle=gr;g.beginPath();g.moveTo(0,0);g.lineTo(Math.cos(a-w)*len,Math.sin(a-w)*len);g.lineTo(Math.cos(a+w)*len,Math.sin(a+w)*len);g.closePath();g.fill();}g.restore();}
function puff(g,cx,cy,w){g.fillStyle="rgba(214,230,245,.95)";g.beginPath();for(let k=0;k<5;k++){const bx=cx+(k-2)*w*.28,br=w*(.2+Math.abs(Math.sin(k*1.7))*.12);g.moveTo(bx+br,cy+w*.05);g.arc(bx,cy+w*.05,br,0,7);}g.fill();
  g.fillStyle="#fff";g.beginPath();for(let k=0;k<5;k++){const bx=cx+(k-2)*w*.28,br=w*(.2+Math.abs(Math.sin(k*1.7))*.12)*.9;g.moveTo(bx+br,cy-w*.02);g.arc(bx,cy-w*.02,br,0,7);}g.fill();}
function bank(g,r,x0,x1,base,h,W,H){const bumps=[];let x=x0;while(x<x1){const rr=h*(.4+r()*.6);bumps.push([x,base-rr*.5,rr]);x+=rr*(.75+r()*.5);}
  const draw=(fill,dy,k)=>{g.fillStyle=fill;g.beginPath();for(const [cx,cy,rr] of bumps){g.moveTo(cx+rr*k,cy+dy);g.arc(cx,cy+dy,rr*k,0,7);}const top=Math.max(...bumps.map(q=>q[1]))+dy;g.rect(bumps[0][0],top,bumps[bumps.length-1][0]-bumps[0][0],H-top+10);g.fill();};
  draw("rgba(214,230,245,.95)",0,1);draw("#FFFFFF",-h*.12,.86);}
function bush(g,r,cx,base,w,h,flip){const cl=[];for(let i=0;i<w*h/380;i++){const u=r(),v=Math.pow(r(),.8);const px=cx+(u-.5)*w,edge=Math.sqrt(Math.max(0,1-Math.pow((px-cx)/(w/2),2)));cl.push([px,base-v*h*edge,14+r()*26*(1-v*.4)]);}
  cl.sort((a,b)=>a[1]-b[1]);const s=flip?-1:1;
  const pass=(dx,dy,k,col,p)=>{g.fillStyle=col;for(const [px,py,rr] of cl){if(r()>p)continue;const q=r();g.beginPath();for(let j=0;j<5;j++){const a=j/5*Math.PI*2+q,dd=rr*k*.45;g.moveTo(px+dx*rr+Math.cos(a)*dd+rr*k*.55,py+dy*rr+Math.sin(a)*dd);g.arc(px+dx*rr+Math.cos(a)*dd,py+dy*rr+Math.sin(a)*dd,rr*k*.55,0,7);}g.fill();}};
  pass(0,0,1,"#24582F",1);pass(-.12*s,-.18,.85,"#337A3C",1);pass(-.25*s,-.32,.6,"#4E9A46",.85);pass(-.34*s,-.42,.38,"#7FC060",.7);pass(-.4*s,-.5,.2,"#CDEB8E",.45);}

  g.save();g.clip(env);["#F4B740","#FFFFFF","#0E8F83","#FFFFFF","#F4B740","#FFFFFF","#0E8F83"].forEach((c,i,a)=>{g.fillStyle=c;g.fillRect(-R*1.1+i*(R*2.2/a.length),-R*1.2,R*2.2/a.length+1,R*2.7);});const sh=g.createLinearGradient(-R,0,R,0);sh.addColorStop(0,"rgba(255,255,255,.35)");sh.addColorStop(.45,"rgba(255,255,255,0)");sh.addColorStop(1,"rgba(15,36,68,.28)");g.fillStyle=sh;g.fillRect(-R*1.2,-R*1.2,R*2.4,R*2.8);g.restore();
  g.strokeStyle="rgba(90,70,48,.8)";g.lineWidth=Math.max(1,k*1.2);[[-R*.32,-R*.2],[R*.32,R*.2]].forEach(([a,b])=>{g.beginPath();g.moveTo(a,R*1.18);g.lineTo(b,R*1.72);g.stroke();});g.fillStyle="#9A7048";g.beginPath();g.roundRect(-R*.26,R*1.7,R*.52,R*.36,R*.06);g.fill();g.restore();}
function scene(g,W,H,o={}){const r=rng(o.seed||2030),t=o.t||0;

function mark(g,cx,cy,h,col){const sc=h/MH;g.save();g.translate(cx-MW*sc/2,cy-h/2);g.scale(sc,sc);g.shadowColor="rgba(255,255,255,.9)";g.shadowBlur=24/sc;g.fillStyle=col||INK;g.fill(MARK);g.restore();}
