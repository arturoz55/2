// Cumulus bank: overlapping circles along a baseline, a lit top layer and a shaded base.
function cloudBank(g,r,x0,x1,base,h,col,alpha){
  // Rounded bumps plus a fill strictly below the bump centres, so no straight edges show.
  const bumps=[];let x=x0;while(x<x1){const rr=h*(.4+r()*.6);bumps.push([x,base-rr*.5,rr]);x+=rr*(.75+r()*.5);}
  g.save();g.globalAlpha=alpha;g.fillStyle=col;g.beginPath();
  for(const [bx,by,rr] of bumps){g.moveTo(bx+rr,by);g.arc(bx,by,rr,0,Math.PI*2);}
  const fx0=bumps[0][0],fx1=bumps[bumps.length-1][0],top=Math.max(...bumps.map(b=>b[1]));g.rect(fx0,top,fx1-fx0,g.canvas.height-top+10);
  g.fill();g.restore();}

function bush(g,r,cx,base,w,h,flip){const cl=[];for(let i=0;i<w*h/380;i++){const u=r(),v=Math.pow(r(),.8);const px=cx+(u-.5)*w,edge=Math.sqrt(Math.max(0,1-Math.pow((px-cx)/(w/2),2)));const py=base-v*h*edge;const rr=14+r()*26*(1-v*.4);cl.push([px,py,rr]);}
